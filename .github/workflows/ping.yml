name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '11 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    name: Ping site
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: HTTP ping https://sanechka-ddah.onrender.com
        run: curl -fsSL --max-time 40 https://sanechka-ddah.onrender.com/api/ping

  activity:
    name: Weekly activity commit (keeps schedule from auto-disable)
    if: github.event.schedule == '11 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-activity
          git add .last-activity
          git commit -m "chore: keep schedule active" || exit 0
          git push
